<style>
:root{--bg:#eaeded;--card:#fff;--ink:#0f1111;--mute:#565959;--line:#dde0e0;--dk:#2b2d30;--dk2:#383b3f;--cta:#ff8a1f;--cta2:#ee7a10;--ok:#1a7f4b;--err:#c4503f;--r:10px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;font-size:16px;width:100%;min-height:42px;border:1px solid #c8cccc;border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
textarea{line-height:1.5}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cta);outline-offset:1px}
.wrap{width:min(1180px,100% - 24px);margin-inline:auto}
.btn{min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--cta2);background:var(--cta);color:#1b1b1b;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--cta2)}
.btn.g{background:#fff;color:var(--ink);border-color:#c8cccc}.btn.g:hover{background:#f3f4f4}
.btn.k{background:var(--dk);border-color:var(--dk);color:#fff}.btn.k:hover{background:#44474c}
.btn.d{background:#fff;color:var(--err);border-color:var(--err)}.btn.d:hover{background:#fdf1ef}
.btn.s{min-height:34px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
header{background:var(--dk);color:#fff;padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:30}
.hd{display:flex;align-items:center;gap:14px;height:62px}
.lg{display:block;height:42px;width:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.hd .ttl{font-weight:600;letter-spacing:.14em;font-size:13px;color:#cfd3d8}
.hd .sp{flex:1}
.hd small{color:#aab0b6}
.tabs{background:var(--dk2);border-top:1px solid #4a4d52}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:0;background:none;color:#e6e8ea;padding:12px 16px;font-weight:600;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--cta)}
.tab b{background:var(--cta);color:#1b1b1b;border-radius:10px;padding:1px 7px;font-size:12px;margin-left:6px}
.login{max-width:400px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.login .top{background:var(--dk);padding:22px;display:grid;place-items:center}.login .top .lg{height:70px}
.login form{padding:22px;display:grid;gap:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px;align-items:center}
.bar input,.bar select{flex:1 1 180px;width:auto}
.bar .chk{flex:none;display:flex;align-items:center;gap:6px;font-size:14px}.bar .chk input{width:20px;min-height:20px;height:20px}
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.rh{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:10px 14px;cursor:pointer;align-items:center}
.rh:hover{background:#fafafa}
.th{width:52px;height:52px;border-radius:8px;background:#f1f2f3;display:grid;place-items:center;overflow:hidden;color:#9aa0a8;font-family:Georgia,serif;font-size:22px}
.th img{width:100%;height:100%;object-fit:contain}
.rh .a{font-weight:600}.rh .b{color:var(--mute);font-size:13px}

/* ================= MALIYET / KAR ================= */
const num=(x,d=0)=>{const n=parseFloat(x);return isFinite(n)?n:d};
const AYAR=()=>({kdv:num(ayar.kdv_orani,20),dahil:ayar.alis_kdv_dahil!==false,kom:num(ayar.komisyon_orani),paket:num(ayar.paket_gider),vergi:num(ayar.vergi_orani),tutma:num(ayar.tutma_orani)});

const gunSay=(t,ref)=>{if(!t)return null;const g=Math.floor(((ref?new Date(ref):new Date())-new Date(t))/864e5);return g<0?0:g};

const tutmaBedel=(A,ay,gun)=>{if(!gun||!(ay.tutma>0))return 0;const bag=ay.dahil?A:A*(1+ay.kdv/100);return bag*ay.tutma/100*gun/30};
function karHesap(F,A,ay,gun=0){
  const k=ay.kdv/100,N=F/(1+k),satKdv=F-N,An=ay.dahil?A/(1+k):A,alKdv=ay.dahil?A-An:A*k;
  const kom=F*ay.kom/100,brut=N-An-kom-ay.paket,vergi=Math.max(0,brut)*ay.vergi/100,net=brut-vergi;
  const tutma=tutmaBedel(A,ay,gun);
  return{F,N,satKdv,An,alKdv,odenecekKdv:satKdv-alKdv,kom,paket:ay.paket,brut,vergi,net,tutma,gercek:net-tutma,marj:N>0?net/N*100:0};
}
// Önerilen satış fiyatı (KDV dahil) – hedef net kâr marjı (net satış üzerinden %)
function oneri(A,ay,marj,T=0){
  const k=ay.kdv/100,t=1-ay.vergi/100,m=marj/100,An=ay.dahil?A/(1+k):A;
  const pay=(An+ay.paket)*t+T,pey=t*(1/(1+k)-ay.kom/100)-m/(1+k);

}

function stokYas(u){

  if(l.length){const t=l.reduce((a,p)=>a+p.kalan,0);return Math.round(l.reduce((a,p)=>a+p.kalan*(gunSay(p.tarih)||0),0)/t)}

}

function stokMaliyetNet(u,ay){

  return l.reduce((a,p)=>a+p.kalan*num(p.birim_net),0)+Math.max(0,stokAdet(u)-pAdet)*An;
}
// Satılan bir kalemin KDV hariç maliyeti (FIFO partileri + partisiz kısım için kayıtlı maliyet)
function kalemMaliyetNet(x,ay,u){
  const k=ay.kdv/100,pl=Array.isArray(x.partiler)?x.partiler:[],pa=pl.reduce((a,p)=>a+num(p.adet),0);
  const A=x.maliyet!=null?num(x.maliyet):num(u&&u.alis_fiyat),An=ay.dahil?A/(1+k):A;
  return pl.reduce((a,p)=>a+num(p.adet)*num(p.net),0)+Math.max(0,x.adet-pa)*An;
}

function sipKar(s){

  (s.kalemler||[]).forEach(x=>{const u=urunler.find(p=>p.id===x.id);const A=x.maliyet!=null?num(x.maliyet):num(u&&u.alis_fiyat);

    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej(new Error("Resim işlenemedi"))},"image/jpeg",.86)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Resim okunamadı"))};im.src=u})}

let stF="stoklu";
function stokAnaliz(){

  const ilk=paid.length?Math.min(...paid.map(s=>+new Date(s.olusturma))):null;

  const sat={};
  paid.filter(s=>+new Date(s.olusturma)>=bas).forEach(s=>(s.kalemler||[]).forEach(x=>{
    const u=urunler.find(p=>p.id===x.id),o=sat[x.id]||(sat[x.id]={adet:0,ciro:0,kar:0}),net=num(x.fiyat)*x.adet/(1+k);
    o.adet+=x.adet;o.ciro+=net;o.kar+=net-kalemMaliyetNet(x,ay,u)}));
  const topCiro=Object.values(sat).reduce((a,o)=>a+o.ciro,0),sirali=Object.entries(sat).sort((a,b)=>b[1].ciro-a[1].ciro),sinif={};
  let kum=0;sirali.forEach(([id,o])=>{kum+=o.ciro;sinif[id]=(kum-o.ciro)/topCiro<0.7?"A":(kum-o.ciro)/topCiro<0.9?"B":"C"});
  const esik1=num(ayar.yas_esik1,60),esik2=num(ayar.yas_esik2,90),i1=num(ayar.indirim1,5),i2=num(ayar.indirim2,12);
  const satirlar=urunler.map(u=>{
    const stok=stokAdet(u),A=num(u.alis_fiyat),yas=stokYas(u),o=sat[u.id]||{adet:0,ciro:0,kar:0},gunluk=o.adet/pen;
    const mal=stokMaliyetNet(u,ay),yeter=gunluk>0?stok/gunluk:null,devir=stok>0&&o.adet>0?(o.adet*365/pen)/stok:null,gmroi=mal>0&&o.adet>0?(o.kar*365/pen)/mal:null;
    let of=null;
    if(stok>0&&A>0&&num(u.fiyat)>0){
      const T=tutmaBedel(A,ay,yas||0),mn=yuvarla(oneri(A,ay,0,T)),f=num(u.fiyat);

      else if(yas!=null&&yas>=esik1){const ind=yas>=esik2?i2:i1;let yeni=Math.floor(f*(1-ind/100)/5)*5;if(mn&&yeni<mn)yeni=mn;if(yeni<f)of={yeni,neden:`${yas} gündür stokta: %${ind} indirim önerisi${mn&&yeni===mn?" (zarar etmeme sınırında durdu)":""}`}}

  });
  return{satirlar,pen,ay,k,veri:paid.length>0};
}

Verileriniz, KVKK md. 5/2 kapsamında; **(c)** sözleşmenin kurulması ve ifası için gerekli olması, **(ç)** hukuki yükümlülüğümüzü yerine getirmek için zorunlu olması ve **(f)** temel hak ve özgürlüklerinize zarar vermemek kaydıyla meşru menfaatimiz için zorunlu olması hukuki sebeplerine dayanılarak işlenir. Verileriniz, sipariş formu ve talep formları aracılığıyla elektronik ortamda toplanır.

## 5. Aktarım
Verileriniz yalnızca yukarıdaki amaçlarla sınırlı olarak; teslimat için **kargo şirketine**, ödeme için **lisanslı ödeme kuruluşuna**, muhasebe ve vergi işlemleri için **mali müşavirimize**, talep hâlinde **yetkili kamu kurum ve kuruluşlarına** ve sitenin çalışması için kullanılan **barındırma ve veritabanı hizmet sağlayıcılarına** aktarılabilir.

Site ve veritabanı altyapısı için kullanılan hizmet sağlayıcıların (GitHub, Supabase) sunucuları yurt dışında bulunabilir. Bu aktarımlar KVKK md. 9'da öngörülen şartlara ve güvencelere uygun olarak yapılır.

## 6. Saklama süresi
Verileriniz işleme amacının gerektirdiği süre ve ilgili mevzuatta öngörülen süreler (ör. vergi ve ticaret mevzuatı gereği 10 yıla kadar) boyunca saklanır; süre sonunda silinir, yok edilir veya anonim hâle getirilir.

## 7. Haklarınız (KVKK md. 11)

function icBirlestir(v){
  const bir=(d,x)=>{
    if(Array.isArray(d))return Array.isArray(x)?x:d;
    if(d&&typeof d==="object"){const o={};const ks=new Set([...Object.keys(d),...Object.keys(x&&typeof x==="object"&&!Array.isArray(x)?x:{})]);
      ks.forEach(k=>{o[k]=k in d?bir(d[k],x?x[k]:undefined):x[k]});return o}
    if(x===undefined||x===null)return d;
    if(typeof d==="number"){const n=parseFloat(x);return isFinite(n)?n:d}
    if(typeof d==="boolean")return !!x;

}

function mdSatir(t,ctx){
  let h=esc(t);
  h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  h=h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,a,u)=>{const uu=u.replace(/&amp;/g,"&");
    if(!/^(#|https?:\/\/|mailto:|tel:)/i.test(uu))return a;
    return `<a href="${esc(uu)}"${/^https?:/i.test(uu)?' target="_blank" rel="noopener"':""}>${a}</a>`});
  h=h.replace(/\{\{([A-Z_]+)\}\}/g,(m,k)=>ctx&&ctx.satir&&k in ctx.satir?ctx.satir[k]:(ctx&&ctx.blok&&k in ctx.blok?ctx.blok[k]:m));
  return h;
}
function md(t,ctx){
  const L=String(t||"").replace(/\r/g,"").split("\n"),o=[];let p=[],lst=null,nt=[];
  const fp=()=>{if(p.length){o.push("<p>"+p.join("<br>")+"</p>");p=[]}};
  const fl=()=>{if(lst){o.push(`<${lst.t}>${lst.i.map(x=>"<li>"+x+"</li>").join("")}</${lst.t}>`);lst=null}};
  const fn=()=>{if(nt.length){o.push('<div class="ynot">'+nt.join("<br>")+"</div>");nt=[]}};
  const fa=()=>{fp();fl();fn()};
  for(const s of L){const x=s.trim();let m;
    if(!x){fa();continue}
    if((m=x.match(/^\{\{([A-Z_]+)\}\}$/))&&ctx&&ctx.blok&&m[1] in ctx.blok){fa();o.push(ctx.blok[m[1]]);continue}
    if(m=x.match(/^(#{2,3})\s+(.*)$/)){fa();const n=m[1].length;o.push(`<h${n}>${mdSatir(m[2],ctx)}</h${n}>`);continue}
    if(m=x.match(/^[-•]\s+(.*)$/)){fp();fn();if(!lst||lst.t!=="ul"){fl();lst={t:"ul",i:[]}}lst.i.push(mdSatir(m[1],ctx));continue}
    if(m=x.match(/^\d+[.)]\s+(.*)$/)){fp();fn();if(!lst||lst.t!=="ol"){fl();lst={t:"ol",i:[]}}lst.i.push(mdSatir(m[1],ctx));continue}
    if(m=x.match(/^>\s?(.*)$/)){fp();fl();nt.push(mdSatir(m[1],ctx));continue}
    fl();fn();p.push(mdSatir(x,ctx));
  }
  fa();return o.join("");
}

  const r=await fetch(SB+"/storage/v1/object/web-gorseller/"+yol,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+t,"Content-Type":tur,"x-upsert":"true"},body:blob});

function sayiTR(x){
  let s=String(x??"").replace(/[₺\s]|TL/gi,"");if(!s)return null;
  if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",",".");
  else if(s.includes(","))s=s.replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  const n=parseFloat(s);return isFinite(n)?n:NaN;
}

const katla=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i").replace(/İ/g,"i");
function esKelime(s,marka){
  const mk=new Set(katla(String(marka||"").toLocaleLowerCase("tr")).split(/[^a-z0-9]+/).filter(Boolean));
  if(mk.has("tt")){mk.add("tangle");mk.add("teezer")}if(mk.has("morgans")){mk.add("morgan");mk.add("s")}
  const BIRIM=/^(ml|g|gr|l|lt|oz|mg|cl|kg)$/,ham=String(s||"").toLocaleLowerCase("tr").replace(/[’']/g,"").split(/[^0-9a-zçğıöşüâîû]+/i).filter(Boolean);
  return [...new Set(ham.filter((w,i)=>!(/^\d+([.,]\d+)?(ml|g|gr|l|lt|oz|mg|cl|kg)$/.test(w))&&!BIRIM.test(w)&&!(/^\d+$/.test(w)&&BIRIM.test(ham[i+1]||"")))   // boyutu (100 ml) at, model numarasini (CR-12) tut
    .map(w=>katla(ES_SOZ[w]||ES_SOZ[katla(w)]||w)).filter(w=>w&&!ES_DUR.has(w)&&!mk.has(w)))];
}
function adayKelime(a,marka){
  let yol="";try{const p=new URL(a.u).pathname.replace(/\.(html?|php|aspx)$/i,"").split("/").filter(Boolean);yol=p.slice(-1)[0]||"";if(yol.length<12&&p.length>1)yol=p.slice(-2).join(" ")}catch(e){}
  yol=decodeURIComponent(yol).replace(/[-_+.]/g," ").replace(/\b\d{5,}\b/g," ");
  return esKelime(yol+" "+(a.t||""),marka);
}
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
const esUyar=(t,c)=>t===c||(t.length>=4&&c.length>=4&&(c.startsWith(t)||t.startsWith(c)))||(t.length>=6&&c.length>=6&&t[0]===c[0]&&lev(t,c)<=2);   // kucuk yazim hatalarini da tanir
function eslestir(u,liste){
  const N=esKelime(u.ad_tam,u.marka);if(!N.length)return [];
  const w=t=>ES_GENEL.has(t)?0.6:1,top=N.reduce((a,t)=>a+w(t),0);
  return (liste||[]).map(a=>{const C=adayKelime(a,u.marka);if(!C.length)return null;
    const bul=N.filter(t=>C.some(c=>esUyar(t,c))).reduce((s,t)=>s+w(t),0)/top,kes=C.filter(c=>N.some(t=>esUyar(t,c))).length/C.length;
    return {u:a.u,t:a.t||"",puan:Math.round((0.7*bul+0.3*kes)*100)/100}}).filter(x=>x&&x.puan>0.2).sort((a,b)=>b.puan-a.puan).slice(0,6);
}
const esEmin=c=>c.length&&c[0].puan>=0.72&&(!c[1]||c[0].puan-c[1].puan>=0.08||adayKelime(c[0],"").join()===adayKelime(c[1],"").join());

async function urunBilgiOto(u){
  const m=u.marka,site=markaSite(m);
  if(site&&!ck.harita[m]&&!adresGecerli(u.kaynak_url||"")){try{ck.harita[m]=(await cek("harita",site)).urunler||[]}catch(x){if(x.message==="oturum")throw x;ck.harita[m]=[]}}
  const kayitli=adresGecerli(u.kaynak_url||"")?[{u:u.kaynak_url.trim(),t:"",puan:1}]:null;   // daha once kaydedilmis adres varsa onu kullan
  let c=kayitli||eslestir(u,ck.harita[m]||[]);
  if(!esEmin(c)&&site){try{const q=esKelime(u.ad_tam,u.marka).join(" ");if(q){const c2=eslestir(u,(await cek("ara",site,q)).urunler||[]);
    c=[...c,...c2].reduce((a,x)=>{const o=a.find(y=>y.u===x.u);if(o)o.puan=Math.max(o.puan,x.puan);else a.push(x);return a},[]).sort((a,b)=>b.puan-a.puan).slice(0,6)}}catch(x){if(x.message==="oturum")throw x}}
  if(!esEmin(c)){if(c.length){ck.aday[u.id]=c;ck.durum[u.id]="? Emin olunamadı. Doğru sayfayı seçin";return "bekle"}return "yok"}
  const s=await cek("sayfa",c[0].u);
  const v={},yeni=[];
  if(!resimler(u).length)for(const g of s.gorseller.slice(0,4)){try{yeni.push(await fotoYukle(u.id,await cek("gorsel",g),yeni.length))}catch(x){if(x.message==="oturum")throw x}}
  if(yeni.length){v.foto=yeni[0];v.galeri=yeni.slice(1)}
  const grup={};if(s.kisa)grup.aciklama=[s.kisa];s.metinler.forEach(t=>(grup[t.alan]=grup[t.alan]||[]).push(t.metin));
  if(!grup.aciklama&&grup.uretici_bilgi){const t=grup.uretici_bilgi[0];grup.aciklama=[t.length>320?t.slice(0,t.lastIndexOf(" ",320))+"…":t]}
  Object.entries(grup).forEach(([k,arr])=>{if(!String(u[k]||"").trim())v[k]=arr.join("\n\n").slice(0,4000)});
  if(kaynakVar())v.kaynak_url=c[0].u;
  if(!Object.keys(v).length)return "yok";
  v.guncelleme=new Date().toISOString();await api("/rest/v1/web_urunler?id=eq."+encodeURIComponent(u.id),{method:"PATCH",body:v,basliklar:{Prefer:"return=minimal"}});
  Object.assign(u,v);delete ck.aday[u.id];ck.durum[u.id]="✔ Otomatik eklendi";return "ok";
}

async function slOnizleBaslat(l){
  const no=++slOnizNo;await slDepoYukle();try{await slFnDene()}catch(e){return}
  l.forEach(x=>{if(!slResim[x.barkod]&&slDepo[x.barkod]&&slDepo[x.barkod].length)slResim[x.barkod]={u:slDepo[x.barkod],tur:"depo"};
    else if(!slResim[x.barkod]){const c=onizOku()[x.barkod];if(c&&c.u&&c.u.length)slResim[x.barkod]=c}
    if(slResim[x.barkod])slResimYenile(x.barkod)});
  const kalan=l.filter(x=>!slResim[x.barkod]).slice(0,60);
  const is=async x=>{if(no!==slOnizNo||sekme!=="urun"||urunMod!=="salon")return;
    const sy=salonSayfa(x.barkod);
    if(sy){try{const sg=await cek("sayfa",sy);if(sg.gorseller&&sg.gorseller.length){slResim[x.barkod]={u:sg.gorseller.slice(0,4),tur:"site",kaynak:sy};slResimYenile(x.barkod);return}}catch(e){if(e.message==="oturum")return}}
    try{slResim[x.barkod]=await slResimBul(x)}catch(e){slResim[x.barkod]={u:[],tur:"yok"};if(e.message==="oturum")return}slResimYenile(x.barkod)};
  for(let i=0;i<kalan.length;i+=2){if(no!==slOnizNo)return;await Promise.all(kalan.slice(i,i+2).map(is))}
}
document.addEventListener("change",async e=>{const f=e.target.closest&&e.target.closest("[data-slyk]");if(!f||sekme!=="urun")return;
  const b=f.dataset.slyk,dosya=f.files&&f.files[0];if(!dosya)return;
  if(!/^image\//.test(dosya.type))return toast("Lütfen bir resim dosyası seçin");
  const el=f.closest(".sl-im");if(el)el.innerHTML="<span>yükleniyor…</span>";
  try{const u=await fotoYukle(b,dosya,0);slDepo=slDepo||{};slDepo[b]=[u];slResim[b]={u:[u],tur:"depo"};slResimYenile(b);toast("Görsel yüklendi. Ürünü eklediğinizde bu görsel kullanılır.")}
  catch(x){if(x.message==="oturum")return oturumHata(x);toast(x.message);slResimYenile(b)}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-imb]");if(!b||sekme!=="urun")return;const bk=b.dataset.imb,r=slResim[bk],sa=slSalon[bk];
  const ru=r&&r.u&&r.u.length?r.u:[];if(!ru.length&&!(sa&&sa.img))return;
  const x=(slOn||[]).find(y=>y.barkod===bk)||{};
  const d=document.createElement("div");d.className="sl-buyuk";d.innerHTML=`<div class="sl-bk"><div class="sl-bh"><b>${esc(x.ad||"")}</b><button class="btn g s" type="button" data-kapat>Kapat</button></div>
    ${sa&&sa.img?`<div class="st-i" style="margin:2px 0 6px"><b>Salon programındaki resim</b>: yalnız ürünü tanımanız için, sitede gösterilmez.</div><div class="sl-bg"><img src="${esc(sa.img)}" alt="" referrerpolicy="no-referrer"></div>`:""}
    <div class="st-i" style="margin:12px 0 6px"><b>Sitede gösterilecek orijinal görseller</b>: ${ru.length?(r.tur==="depo"?"daha önce siteye yüklenmiş":r.tur==="site"?"markanın sitesinden bulundu":"barkod veritabanından bulundu")+". Ürünü eklediğinizde bunlar kullanılır.":!r?"aranıyor…":"bulunamadı. Ürünü ekledikten sonra “Üretici sitesinden getir” ile ya da bilgisayardan ekleyebilirsiniz."}</div>
    ${ru.length?`<div class="sl-bg">${ru.map(u=>`<img src="${esc(u)}" alt="" referrerpolicy="no-referrer">`).join("")}</div>`:""}</div>`;
  d.onclick=ev=>{if(ev.target===d||ev.target.closest("[data-kapat]"))d.remove()};document.body.appendChild(d)});

/* ---------- Salon programinda degisen urunler (onayiniza sunulur) ---------- */
async function degisimYukle(){degisim=(await api("/rest/v1/web_salon_degisiklik?select=*&order=tarih.desc").catch(()=>null))||[]}
function degisimKutusu(){
  const d=degisim.filter(x=>urunler.some(u=>u.id===x.barkod));if(!d.length)return "";
  const ad=b=>{const u=urunler.find(x=>x.id===b);return u?u.ad_tam:b};
  return `<div class="box dgs"><b>Salon programında değişen ürünler (${d.length})</b><p class="st-a" style="margin:4px 0 8px">Bu ürünler sitede de var. Değişikliği siteye uygulamak isteyip istemediğinizi seçin.</p>
   ${d.map(x=>`<div class="dgs-s" data-db="${esc(x.barkod)}" data-da="${esc(x.alan)}"><div><b>${esc(ad(x.barkod))}</b><br><span class="st-i">${x.alan==="silindi"?"Salon programından silindi.":`${x.alan==="ad"?"Ürün adı":"Marka"}: <s>${esc(x.eski)}</s> → <b>${esc(x.yeni)}</b>`}</span></div>
     <div class="flow" style="margin:0">${x.alan==="silindi"?`<button class="btn d s" type="button" data-dg="uygula">Siteden kaldır (gizle)</button><button class="btn g s" type="button" data-dg="yoksay">Sitede kalsın</button>`
       :`<button class="btn s" type="button" data-dg="uygula">Siteye uygula</button><button class="btn g s" type="button" data-dg="yoksay">Yok say</button>`}</div></div>`).join("")}</div>`;
}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-dg]");if(!b||sekme!=="urun")return;
  const s=b.closest(".dgs-s"),bk=s.dataset.db,al=s.dataset.da,x=degisim.find(y=>y.barkod===bk&&y.alan===al);if(!x)return;b.disabled=true;
  try{if(b.dataset.dg==="uygula"){const v=al==="ad"?{ad_tam:x.yeni}:al==="marka"?{marka:x.yeni}:{aktif:false};v.guncelleme=new Date().toISOString();
      await api("/rest/v1/web_urunler?id=eq."+encodeURIComponent(bk),{method:"PATCH",body:v,basliklar:{Prefer:"return=minimal"}});Object.assign(urunler.find(u=>u.id===bk)||{},v)}
    await api(`/rest/v1/web_salon_degisiklik?barkod=eq.${encodeURIComponent(bk)}&alan=eq.${al}`,{method:"DELETE",basliklar:{Prefer:"return=minimal"}});
    degisim=degisim.filter(y=>y!==x);acik=null;ciz();toast(b.dataset.dg==="uygula"?"Siteye uygulandı":"Yok sayıldı")}
  catch(x){b.disabled=false;oturumHata(x)}});

  return `<div class="box dgs"><b>Görsel için seçiminizi bekleyen ürünler (${l.length})</b><p class="st-a" style="margin:4px 0 8px">Sistem bu ürünlerin sayfasını markanın sitesinde bulamadı ya da emin olamadı. Ürüne tıklayın; açılan bölümde doğru sayfayı seçin.</p>
   <div class="flow" style="margin:0">${l.map(u=>`<button class="btn g s" type="button" data-ac="${esc(u.id)}">${esc(u.ad_tam)}</button>`).join("")}</div></div>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-ac]");if(!b||sekme!=="urun")return;acik=b.dataset.ac;ciz();

/* ---------- arka planda gorsel getirme ---------- */
let otoCalisti=false,otoDurum=null;
async function otoGorselGetir(liste){
  if(!ayar.oto_bilgi)return;
  const l=liste.filter(u=>!resimler(u).length&&(markaSite(u.marka)||adresGecerli(u.kaynak_url||"")));if(!l.length)return;
  otoDurum={calisiyor:true,uygulanan:0,bekleyen:0,yazi:`görseller aranıyor 0/${l.length}`};otoRozet();let n=0;
  for(const u of l){otoDurum.yazi=`görseller aranıyor ${++n}/${l.length}`;otoRozet();
    try{const r=await urunBilgiOto(u);if(r==="ok")otoDurum.uygulanan++;else if(r==="bekle")otoDurum.bekleyen++}catch(x){if(x.message==="oturum"){otoDurum=null;otoRozet();return}}}
  otoDurum.calisiyor=false;otoRozet();
  if(sekme==="urun"&&urunMod==="liste"&&!acik)ciz();
}
/* Salon resmi sitede gosterilmez: siteye gecmis salon resimlerini "Urun gorselleri"nden kaldir,
   salon programindaki sayfa adresini "Uretici sitesinden getir" adresine yaz. Orijinal gorseller ardindan getirilir. */
async function salonResimEsitle(){
  try{await salonVeriYukle(true)}catch(x){return []}
  const temiz=[];let nr=0,na=0;
  for(const u of urunler){const sy=salonSayfa(u.id),v={};
    const once=resimler(u),sonra=once.filter(g=>!salonResmiMi(g,u.id));
    if(sonra.length!==once.length){v.foto=sonra[0]||"";v.galeri=sonra.slice(1);nr++}
    if(sy&&kaynakVar()&&!adresGecerli(u.kaynak_url||"")){v.kaynak_url=sy;na++}
    if(!Object.keys(v).length)continue;
    try{v.guncelleme=new Date().toISOString();await api("/rest/v1/web_urunler?id=eq."+encodeURIComponent(u.id),{method:"PATCH",body:v,basliklar:{Prefer:"return=minimal"}});Object.assign(u,v);if(!resimler(u).length)temiz.push(u)}
    catch(x){if(x.message==="oturum")return temiz}}
  if(nr||na){toast([nr?nr+" üründen salon resmi siteden kaldırıldı":"",na?na+" ürüne üretici sayfa adresi yazıldı":""].filter(Boolean).join(" · ")+(temiz.length?". Orijinal görseller getiriliyor…":""));
  }
  if(sekme==="urun"&&urunMod==="liste"&&!acik)ciz();
  return temiz;
}
async function otomatikCalistir(){
  if(otoCalisti)return;otoCalisti=true;
  await degisimYukle();if(degisim.length&&sekme==="urun"&&urunMod==="liste"&&!acik)ciz();
  const temiz=await salonResimEsitle();
  let den={};try{den=JSON.parse(localStorage.getItem("apron_oto_denendi")||"{}")}catch(x){}
  const hafta=7*864e5,l=[...new Set([...temiz,...urunler.filter(u=>!(den[u.id]>Date.now()-hafta)).slice(0,30)])];
  l.forEach(u=>den[u.id]=Date.now());try{localStorage.setItem("apron_oto_denendi",JSON.stringify(den))}catch(x){}
  await otoGorselGetir(l);
}
document.addEventListener("click",e=>{if(e.target.closest("#otoR")&&otoDurum&&!otoDurum.calisiyor){sekme="urun";urunMod="liste";acik=null;ciz();scrollTo(0,0)}});

document.addEventListener("click",e=>{const v=e.target.closest("[data-vaz]");if(!v||(sekme!=="sip"&&sekme!=="tal"))return;e.stopPropagation();const y=scrollY;ciz();scrollTo(0,y);toast("Yazdıklarınız geri alındı")},true);
/* ================= AYARLAR: alt sekmeler, marka siteleri, sifre ================= */
document.addEventListener("click",e=>{const g=e.target.closest("[data-git]");if(!g)return;sekme="urun";urunMod=g.dataset.git;acik=null;ciz();scrollTo(0,0)});
const AYAR_ALT=[["salon","Salon bağlantısı"],["maliyet","Maliyet ve vergi"],["uretici","Üretici bilgileri"],["hesap","Hesap"]];
let ayarAlt="salon";
function markaKutusu(){
  const ms=ayar.marka_siteleri||{},markalar=[...new Set(urunler.map(u=>u.marka).filter(Boolean).concat(Object.keys(ms)))].sort((a,b)=>a.localeCompare(b,"tr"));
  return `<div class="box"><b>Görselleri otomatik getir</b>
   <label class="oto-s" style="border-top:0"><input type="checkbox" id="o_bilgi"${ayar.oto_bilgi!==false?" checked":""}><span><b>Görsel ve bilgileri markanın sitesinden getir</b><br><span class="st-i">Siteye eklediğiniz ürünlerin görselleri, açıklama, kullanım ve içindekiler bilgileri kendiliğinden getirilir. Emin olunamayan ürünler “Sitedeki ürünler” ekranında seçiminize sunulur.</span></span></label>
   <p class="st-a"><b>Marka siteleri:</b> Sistem ürünün sayfasını bu sitelerde arar. Türkçe sayfası varsa onu yazın (ör. <code>https://www.marka.com/tr</code>).</p>
   ${markalar.length?`<div class="g3">${markalar.map(m=>`<label>${esc(m)}<input data-ms="${esc(m)}" inputmode="url" placeholder="https://..." value="${esc(ms[m]||"")}">${!ms[m]&&MARKA_ONERI[m]?`<button type="button" class="st-on2" data-msoner="${esc(m)}">Öneri: ${esc(MARKA_ONERI[m])}</button>`:""}</label>`).join("")}</div>`
     :`<div class="st-i">Siteye ürün ekledikçe markaları burada görünür.</div>`}
   <div class="flow"><button class="btn" type="button" id="msKay">Kaydet</button><button class="btn g" type="button" id="msVaz">Vazgeç</button></div></div>`;
}
document.addEventListener("click",async e=>{
  if(sekme!=="ayar")return;const t=e.target;
  const a=t.closest("[data-aalt]");if(a){ayarAlt=a.dataset.aalt;document.querySelectorAll("[data-ab]").forEach(x=>x.hidden=x.dataset.ab!==ayarAlt);document.querySelectorAll("[data-aalt]").forEach(x=>x.classList.toggle("on",x===a));return}
  if(t.dataset.msoner){const i=document.querySelector(`[data-ms="${CSS.escape(t.dataset.msoner)}"]`);if(i)i.value=MARKA_ONERI[t.dataset.msoner];t.remove();return}
  if(t.id==="msVaz"){ciz();return toast("Değişiklikler geri alındı")}
  if(t.id==="msKay"){const v={};document.querySelectorAll("[data-ms]").forEach(i=>{const x=i.value.trim();if(x)v[i.dataset.ms]=x});
    const bozuk=Object.values(v).filter(x=>!adresGecerli(x));if(bozuk.length)return toast("Geçersiz adres: "+bozuk[0]);
    const body={marka_siteleri:v,oto_bilgi:$("#o_bilgi").checked};t.disabled=true;
    try{await api("/rest/v1/web_ayar?id=eq.ana",{method:"PATCH",body,basliklar:{Prefer:"return=minimal"}});Object.assign(ayar,body);ck.harita={};toast("Kaydedildi")}catch(x){oturumHata(x)}finally{t.disabled=false}return}
  if(t.id==="h_vaz"){$("#h_s1").value=$("#h_s2").value="";return}
  if(t.id==="h_deg"){const s1=$("#h_s1").value,s2=$("#h_s2").value;
    if(s1.length<8)return toast("Şifre en az 8 karakter olmalı");if(s1!==s2)return toast("İki şifre aynı değil");if(!/[a-zA-ZçğıöşüÇĞİÖŞÜ]/.test(s1)||!/\d/.test(s1))return toast("Şifrede harf ve rakam olsun");
    t.disabled=true;try{const tk=await token();const r=await fetch(SB+"/auth/v1/user",{method:"PUT",headers:{apikey:KEY,Authorization:"Bearer "+tk,"Content-Type":"application/json"},body:JSON.stringify({password:s1})});
      const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.message||j.error_description||("Hata "+r.status));
      $("#h_s1").value=$("#h_s2").value="";toast("Şifre değiştirildi. Bir dahaki girişte yeni şifreyi kullanın.")}
    catch(x){toast(/reauthenticat|nonce/i.test(x.message)?"Supabase şifre değişikliği için e-posta onayı istiyor. Çıkış yapıp “şifremi unuttum” yolunu kullanın.":/same|different/i.test(x.message)?"Yeni şifre eskisiyle aynı olamaz":x.message)}finally{t.disabled=false}return}
});

oturum?ac():giris();
</script>
